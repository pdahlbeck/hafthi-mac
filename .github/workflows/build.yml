name: Build macOS app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check interactive Ghost Tasks
        run: sh tests/ghost-interactive.sh
      - name: Build with SwiftPM
        run: swift build --build-system native
      - name: Build app bundle
        run: bash build-app.sh
      - name: Verify bundled Sampler dashboard
        run: |
          swift -e 'import Foundation; guard let bundle = Bundle(path: FileManager.default.currentDirectoryPath + "/build/Hafþi.app"), let url = bundle.url(forResource: "SamplerDefault", withExtension: "yml"), let data = try? Data(contentsOf: url), !data.isEmpty else { fatalError("Sampler config is not readable from Hafþi.app") }'
      - name: Package test app
        run: ditto -c -k --keepParent "build/Hafþi.app" "Hafthi-macOS-test.zip"
      - name: Upload test app
        uses: actions/upload-artifact@v4
        with:
          name: Hafthi-macOS-test
          path: Hafthi-macOS-test.zip
