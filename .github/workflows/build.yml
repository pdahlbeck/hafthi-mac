name: Build macOS app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with SwiftPM
        run: swift build --build-system native
      - name: Build app bundle
        run: bash build-app.sh
      - name: Verify bundled Sampler dashboard
        run: test -f 'build/Hafþi.app/Contents/Resources/HafthiMac_HafthiMac.bundle/Resources/SamplerDefault.yml' || test -f 'build/Hafþi.app/Contents/Resources/HafthiMac_HafthiMac.bundle/SamplerDefault.yml'
