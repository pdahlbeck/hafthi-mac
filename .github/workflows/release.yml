name: Publish Hafþi beta

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        run: |
          test "$(uname -m)" = arm64
          bash build-app.sh
          lipo build/Hafþi.app/Contents/MacOS/Hafthi -verify_arch arm64
      - name: Sign and package app
        run: |
          codesign --force --deep --sign - build/Hafþi.app
          codesign --verify --deep --strict build/Hafþi.app
          ditto -c -k --keepParent build/Hafþi.app Hafthi-0.1.0-beta.2-macOS-arm64.zip
          shasum -a 256 Hafthi-0.1.0-beta.2-macOS-arm64.zip > Hafthi-0.1.0-beta.2-macOS-arm64.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-beta.2 \
            Hafthi-0.1.0-beta.2-macOS-arm64.zip \
            Hafthi-0.1.0-beta.2-macOS-arm64.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Hafþi 0.1.0 beta 2" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
