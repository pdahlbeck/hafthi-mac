name: Publish Hafþi beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

env:
  VERSION: 0.1.0-beta.17

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        run: |
          test "$(uname -m)" = arm64
          bash build-app.sh
          lipo build/Hafþi.app/Contents/MacOS/Hafthi -verify_arch arm64
      - name: Sign and package app
        run: |
          codesign --force --deep --sign - build/Hafþi.app
          codesign --verify --deep --strict build/Hafþi.app
          artifact="Hafthi-${VERSION}-macOS-arm64.zip"
          ditto -c -k --keepParent build/Hafþi.app "$artifact"
          shasum -a 256 "$artifact" > "${artifact}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="Hafthi-${VERSION}-macOS-arm64.zip"
          gh release create "v${VERSION}" \
            "$artifact" \
            "${artifact}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hafþi ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
